name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: Version ermitteln
        id: ver
        run: |
          base=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2)
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: PdfExtraktor-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Release mit APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF Extraktor ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            Version ${{ steps.ver.outputs.version }}
            Application-ID: com.coolcupman.pdfextractor.v${{ steps.ver.outputs.version }} (Punkte → _)
            Jede Version hat eine eigene ID und kann parallel installiert werden.
